# Stack de test indépendante : aucun volume ni secret de production.
services:
  tests:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      - ./docker/testing.env:/var/www/html/.env:ro
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_DATABASE: relaxit_test
      DB_USERNAME: relaxit_test
      DB_PASSWORD: test-only
      DB_URL: ""
      REDIS_HOST: redis-test
      REDIS_PASSWORD: "null"
      CACHE_STORE: array
      SESSION_DRIVER: array
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: php artisan test
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relaxit_test
      POSTGRES_USER: relaxit_test
      POSTGRES_PASSWORD: test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U relaxit_test -d relaxit_test]
      interval: 2s
      timeout: 5s
      retries: 20
  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 20
