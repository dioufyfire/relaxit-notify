name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
      - run: docker compose -f docker-compose.test.yml build tests
      - run: docker compose -f docker-compose.test.yml run --rm --no-deps tests composer install --no-interaction --prefer-dist
      - run: docker compose -f docker-compose.test.yml run --rm tests php artisan test
      - run: docker compose -f docker-compose.test.yml run --rm --no-deps tests vendor/bin/pint --test
      - if: always()
        run: docker compose -f docker-compose.test.yml down
